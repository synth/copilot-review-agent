<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'nonce-{{NONCE}}'; script-src 'nonce-{{NONCE}}';">
<style nonce="{{NONCE}}">
/* ═══════════════════════════════════════════════
   Reset & base
   ═══════════════════════════════════════════════ */
:root { --vscode-font: var(--vscode-font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--vscode-font);
  font-size: var(--vscode-font-size, 13px);
  color: var(--vscode-foreground);
  background: var(--vscode-sideBar-background);
  padding: 12px;
  overflow-x: hidden;
}
h3 {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--vscode-sideBarSectionHeader-foreground, var(--vscode-foreground));
  margin-bottom: 8px;
}
.section { margin-bottom: 14px; }
label {
  display: block; font-size: 11px;
  color: var(--vscode-descriptionForeground); margin-bottom: 3px;
}
select {
  width: 100%; padding: 4px 6px;
  background: var(--vscode-input-background);
  color: var(--vscode-input-foreground);
  border: 1px solid var(--vscode-input-border, transparent);
  border-radius: 2px; font-size: 12px; font-family: var(--vscode-font);
  outline: none; margin-bottom: 8px;
}
select:focus { border-color: var(--vscode-focusBorder); }
.native-select {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
button {
  width: 100%; padding: 6px 14px; font-size: 13px;
  font-family: var(--vscode-font); cursor: pointer;
  border: none; border-radius: 2px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
button.primary {
  background: var(--vscode-button-background);
  color: var(--vscode-button-foreground);
}
button.primary:hover { background: var(--vscode-button-hoverBackground); }
button.primary:disabled { opacity: 0.5; cursor: default; }
button.secondary {
  background: var(--vscode-button-secondaryBackground);
  color: var(--vscode-button-secondaryForeground);
}
button.secondary:hover { background: var(--vscode-button-secondaryHoverBackground); }
.btn-row { display: flex; gap: 6px; margin-top: 4px; }
.btn-row button { width: auto; flex: 1; }
.run-row { display: flex; gap: 6px; align-items: stretch; }
.run-row .primary { flex: 1; }
.stop-btn {
  width: 32px !important; min-width: 32px; padding: 0; flex-shrink: 0;
  background: var(--vscode-inputValidation-errorBackground, #5a1d1d);
  color: var(--vscode-errorForeground, #f44747);
  border: 1px solid var(--vscode-inputValidation-errorBorder, #be1100);
  border-radius: 2px; cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
}
.stop-btn:hover { opacity: 0.9; }
.link-btn {
  background: none; border: none; width: auto; padding: 0;
  color: var(--vscode-textLink-foreground); cursor: pointer;
  font-size: 11px; display: inline; text-decoration: underline;
}
.link-btn:hover { color: var(--vscode-textLink-activeForeground); }

/* ═══════════════════════════════════════════════
   Branch / model display
   ═══════════════════════════════════════════════ */
.branch-display {
  display: flex; align-items: center; gap: 6px; padding: 4px 6px;
  background: var(--vscode-input-background);
  border: 1px solid var(--vscode-input-border, transparent);
  border-radius: 2px; font-size: 12px; margin-bottom: 8px; min-height: 26px;
}
.branch-tag {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px;
  background: var(--vscode-badge-background); color: var(--vscode-badge-foreground);
  border-radius: 10px; font-size: 11px; font-weight: 500;
}
.arrow { color: var(--vscode-descriptionForeground); font-size: 14px; margin: 0 2px; }
.branch-picker {
  position: relative;
  margin-bottom: 8px;
}
.picker-trigger {
  width: 100%;
  min-height: 36px;
  padding: 8px 10px;
  background: var(--vscode-input-background);
  color: var(--vscode-input-foreground);
  border: 1px solid var(--vscode-input-border, transparent);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
}
.picker-trigger:hover,
.picker-trigger:focus-visible,
.branch-picker.open .picker-trigger {
  border-color: var(--vscode-focusBorder);
}
.picker-trigger:disabled {
  opacity: 0.6;
  cursor: default;
  box-shadow: none;
}
.picker-trigger-text {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
}
.picker-trigger-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--vscode-input-foreground);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.picker-trigger-description {
  font-size: 10px;
  color: var(--vscode-descriptionForeground);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.picker-trigger-icon {
  color: var(--vscode-descriptionForeground);
  font-size: 10px;
  flex-shrink: 0;
}
.picker-panel {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  z-index: 30;
  padding: 8px;
  border-radius: 14px;
  border: 1px solid var(--vscode-editorWidget-border, #333);
  background: var(--vscode-editorWidget-background, var(--vscode-sideBar-background));
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
}
.picker-search {
  width: 100%;
  padding: 7px 10px;
  margin-bottom: 8px;
  background: var(--vscode-input-background);
  color: var(--vscode-input-foreground);
  border: 1px solid var(--vscode-input-border, transparent);
  border-radius: 9px;
  outline: none;
  font: inherit;
}
.picker-search:focus { border-color: var(--vscode-focusBorder); }
.picker-options {
  max-height: 220px;
  overflow-y: auto;
}
.picker-group-label {
  padding: 6px 8px 4px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--vscode-descriptionForeground);
}
.picker-option {
  width: 100%;
  padding: 8px 10px;
  margin-bottom: 2px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: transparent;
  color: var(--vscode-foreground);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  text-align: left;
}
.picker-option:hover,
.picker-option.active {
  background: var(--vscode-list-hoverBackground);
  border-color: var(--vscode-focusBorder);
}
.picker-option.selected {
  background: var(--vscode-list-activeSelectionBackground, var(--vscode-list-hoverBackground));
  border-color: var(--vscode-focusBorder);
}
.picker-option-main {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.picker-option-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--vscode-foreground);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.picker-option-description {
  font-size: 10px;
  color: var(--vscode-descriptionForeground);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.picker-option-check {
  color: var(--vscode-testing-iconPassed, #388a34);
  font-size: 12px;
  flex-shrink: 0;
  opacity: 0;
}
.picker-option.selected .picker-option-check { opacity: 1; }
.picker-empty {
  padding: 10px;
  text-align: center;
  color: var(--vscode-descriptionForeground);
  font-size: 11px;
}

/* ═══════════════════════════════════════════════
   Screens
   ═══════════════════════════════════════════════ */
.screen { display: none; }
.screen.active { display: block; }
.hidden { display: none !important; }
.history-header { display: flex; align-items: center; justify-content: space-between; }
.history-header h3 { margin-bottom: 0; }

/* ═══════════════════════════════════════════════
   History list
   ═══════════════════════════════════════════════ */
.history-item {
  padding: 8px 10px; border-radius: 3px; cursor: pointer;
  margin-bottom: 4px; border: 1px solid transparent; transition: background 0.1s;
}
.history-item:hover { background: var(--vscode-list-hoverBackground); }
.history-item .hi-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px;
}
.history-item .hi-branches {
  font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 4px;
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.history-item .hi-date {
  font-size: 10px; color: var(--vscode-descriptionForeground); flex-shrink: 0; margin-left: 8px;
}
.history-item .hi-stats {
  font-size: 11px; color: var(--vscode-descriptionForeground); display: flex; align-items: center;
}
.history-item .hi-meta {
  margin-top: 4px;
  font-size: 10px;
  color: var(--vscode-descriptionForeground);
}
.hi-badge {
  display: inline-block; padding: 0 5px; border-radius: 8px;
  font-size: 10px; font-weight: 600; margin-right: 4px;
}
.hi-badge.open {
  background: var(--vscode-editorWarning-foreground, #cca700);
  color: var(--vscode-editor-background, #1e1e1e);
}
.hi-badge.clear {
  background: var(--vscode-testing-iconPassed, #388a34);
  color: var(--vscode-editor-background, #1e1e1e);
}
.history-item .hi-delete {
  display: none; background: none; border: none;
  color: var(--vscode-descriptionForeground); cursor: pointer;
  padding: 2px 4px; font-size: 14px; width: auto; line-height: 1; margin-left: auto;
}
.history-item:hover .hi-delete { display: inline-block; }
.history-item .hi-delete:hover { color: var(--vscode-errorForeground); }
.empty-state {
  text-align: center; color: var(--vscode-descriptionForeground);
  padding: 24px 12px; font-size: 12px; line-height: 1.6;
}
.empty-state .es-icon { font-size: 28px; margin-bottom: 8px; display: block; }

.back-btn {
  background: none; border: none; color: var(--vscode-textLink-foreground);
  cursor: pointer; padding: 0 0 8px 0; font-size: 12px;
  display: flex; align-items: center; gap: 4px; width: auto;
}
.back-btn:hover { text-decoration: underline; }

/* ═══════════════════════════════════════════════
   Detail header
   ═══════════════════════════════════════════════ */
.detail-header {
  padding: 6px 0 10px 0;
  border-bottom: 1px solid var(--vscode-editorWidget-border, #333);
  margin-bottom: 12px;
}
.detail-header .dh-branches { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.detail-header .dh-date { font-size: 11px; color: var(--vscode-descriptionForeground); }
.detail-header .dh-model {
  font-size: 11px;
  color: var(--vscode-descriptionForeground);
  margin-top: 4px;
}

/* ═══════════════════════════════════════════════
   Instructions indicator
   ═══════════════════════════════════════════════ */
.instructions-row {
  display: flex; align-items: center; gap: 6px; font-size: 11px;
  color: var(--vscode-descriptionForeground); margin-bottom: 8px;
  padding: 4px 0;
}
.instructions-row .dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
}
.instructions-row .dot.active { background: var(--vscode-testing-iconPassed, #388a34); }
.instructions-row .dot.inactive { background: var(--vscode-descriptionForeground); opacity: 0.4; }

/* ═══════════════════════════════════════════════
   Agent loop — Copilot-style
   ═══════════════════════════════════════════════ */
#agent-loop { display: none; }
#agent-loop.visible { display: block; margin-top: 12px; }

.task-group { margin-bottom: 2px; border-radius: 4px; overflow: hidden; }
.task-header {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px;
  font-size: 12px; font-weight: 500; cursor: pointer; user-select: none;
  border-radius: 4px; background: transparent; transition: background 0.1s;
}
.task-header:hover { background: var(--vscode-list-hoverBackground); }
.task-header .task-chevron {
  flex-shrink: 0; width: 16px; text-align: center; font-size: 10px;
  color: var(--vscode-descriptionForeground); transition: transform 0.15s ease;
}
.task-group.collapsed .task-chevron { transform: rotate(-90deg); }
.task-header .task-icon { flex-shrink: 0; width: 16px; text-align: center; font-size: 13px; }
.task-header .task-label { flex: 1; min-width: 0; }
.task-header .task-detail {
  font-size: 11px; font-weight: 400; color: var(--vscode-descriptionForeground);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px;
}
.task-body { overflow: hidden; transition: max-height 0.2s ease; max-height: 2000px; }
.task-group.collapsed .task-body { max-height: 0; }
.sub-steps { padding: 2px 0 6px 32px; }
.sub-step {
  display: flex; align-items: flex-start; gap: 6px; padding: 2px 0;
  font-size: 11px; line-height: 1.5; color: var(--vscode-descriptionForeground);
}
.sub-step .ss-icon { flex-shrink: 0; width: 14px; text-align: center; font-size: 11px; }
.sub-step .ss-label { flex: 1; min-width: 0; word-break: break-word; }
.sub-step .ss-detail {
  display: block; font-size: 10px; color: var(--vscode-descriptionForeground);
  opacity: 0.8; margin-top: 1px;
}
.ss-stream {
  display: block;
  font-family: var(--vscode-editor-font-family, 'Cascadia Code', 'Fira Code', monospace);
  font-size: 11px; line-height: 1.4; color: var(--vscode-descriptionForeground);
  opacity: 0.7; white-space: pre-wrap; word-break: break-word;
  max-height: 60px; overflow: hidden; margin-top: 2px;
}
.task-group.status-running .task-header { color: var(--vscode-foreground); }
.task-group.status-done .task-header { color: var(--vscode-descriptionForeground); }
.task-group.status-error .task-header { color: var(--vscode-errorForeground); }

@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  display: inline-block; width: 12px; height: 12px;
  border: 1.5px solid var(--vscode-descriptionForeground);
  border-top-color: var(--vscode-progressBar-background, #0078d4);
  border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle;
}
.spinner-sm {
  display: inline-block; width: 10px; height: 10px;
  border: 1.5px solid var(--vscode-descriptionForeground);
  border-top-color: var(--vscode-progressBar-background, #0078d4);
  border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle;
}
.progress-bar-track {
  width: 100%; height: 2px;
  background: var(--vscode-editorWidget-border, #333);
  border-radius: 1px; margin-bottom: 10px; overflow: hidden;
}
.progress-bar-fill {
  height: 100%; background: var(--vscode-progressBar-background, #0078d4);
  border-radius: 1px; transition: width 0.3s ease; width: 0%;
}

/* ═══════════════════════════════════════════════
   Summary
   ═══════════════════════════════════════════════ */
#summary {
  display: none; padding: 10px 12px; border-radius: 4px;
  font-size: 12px; line-height: 1.5;
  background: var(--vscode-editor-inactiveSelectionBackground, rgba(255,255,255,0.05));
  border: 1px solid var(--vscode-editorWidget-border, #333);
  margin-top: 8px;
}
#summary.visible { display: block; }
#summary .sum-headline { font-weight: 600; margin-bottom: 4px; display: block; }
#summary .count { font-weight: 600; }

/* ═══════════════════════════════════════════════
   Separator
   ═══════════════════════════════════════════════ */
.separator {
  height: 1px; background: var(--vscode-editorWidget-border, #333);
  margin: 12px 0;
}
</style>
</head>
<body>

<!-- ========== SCREEN: History ========== -->
<div id="screen-history" class="screen active">
  <div class="section history-header">
    <h3>Review History</h3>
  </div>
  <div class="section">
    <button id="new-review-btn" class="primary"><span>＋</span><span>New Review</span></button>
  </div>
  <div id="history-list"></div>
</div>

<!-- ========== SCREEN: Detail ========== -->
<div id="screen-detail" class="screen">
  <button class="back-btn" id="back-btn">← History</button>

  <!-- Past review header -->
  <div id="past-review-header" class="detail-header hidden">
    <div class="dh-branches">
      <span class="branch-tag" id="dh-base">—</span>
      <span class="arrow">←</span>
      <span class="branch-tag" id="dh-target">—</span>
    </div>
    <div class="dh-date" id="dh-date"></div>
    <div class="dh-model hidden" id="dh-model"></div>
  </div>

  <!-- New review controls -->
  <div id="new-review-controls">
    <div class="section">
      <h3>Branch Selection</h3>
      <label for="base-branch">Base branch</label>
      <select id="base-branch" class="native-select"><option value="">Loading branches…</option></select>
      <div id="base-picker" class="branch-picker"></div>
      <label for="target-branch">Target</label>
      <select id="target-branch" class="native-select"><option value="">Loading branches…</option></select>
      <div id="target-picker" class="branch-picker"></div>
      <div id="branch-summary" class="branch-display hidden">
        <span class="branch-tag" id="base-tag">—</span>
        <span class="arrow">←</span>
        <span class="branch-tag" id="target-tag">—</span>
      </div>
    </div>

    <div class="section">
      <label for="model-select">Model</label>
      <select id="model-select"><option value="">Loading models…</option></select>
    </div>

    <div id="instructions-row" class="instructions-row hidden">
      <span class="dot" id="instr-dot"></span>
      <span id="instr-text"></span>
      <button class="link-btn" id="instr-action"></button>
    </div>

    <div class="section" id="action-buttons">
      <div class="run-row">
        <button id="run-btn" class="primary" disabled>
          <span id="run-icon">▶</span>
          <span id="run-label">Run Review</span>
        </button>
        <button id="stop-btn" class="stop-btn hidden" title="Stop review">■</button>
      </div>
    </div>
  </div>

  <div class="btn-row hidden" id="post-actions">
    <button id="clear-btn" class="secondary">Clear</button>
    <button id="export-btn" class="secondary">Export</button>
  </div>

  <div id="agent-loop" class="section">
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progress-fill"></div></div>
    <div id="tasks-container"></div>
  </div>

  <div id="summary"></div>
</div>

<script nonce="{{NONCE}}">
(function() {
  const vscode = acquireVsCodeApi();

  // ── DOM refs ──
  const screenHistory = document.getElementById('screen-history');
  const screenDetail  = document.getElementById('screen-detail');
  const historyList   = document.getElementById('history-list');
  const newReviewBtn  = document.getElementById('new-review-btn');
  const backBtn       = document.getElementById('back-btn');
  const pastReviewHeader  = document.getElementById('past-review-header');
  const newReviewControls = document.getElementById('new-review-controls');
  const dhBase   = document.getElementById('dh-base');
  const dhTarget = document.getElementById('dh-target');
  const dhDate   = document.getElementById('dh-date');
  const dhModel  = document.getElementById('dh-model');

  const baseSelect   = document.getElementById('base-branch');
  const targetSelect = document.getElementById('target-branch');
  const basePicker   = document.getElementById('base-picker');
  const targetPicker = document.getElementById('target-picker');
  const branchSummary = document.getElementById('branch-summary');
  const baseTag  = document.getElementById('base-tag');
  const targetTag = document.getElementById('target-tag');

  const modelSelect = document.getElementById('model-select');

  const instrRow    = document.getElementById('instructions-row');
  const instrDot    = document.getElementById('instr-dot');
  const instrText   = document.getElementById('instr-text');
  const instrAction = document.getElementById('instr-action');

  const runBtn       = document.getElementById('run-btn');
  const runIcon      = document.getElementById('run-icon');
  const runLabel     = document.getElementById('run-label');
  const stopBtn      = document.getElementById('stop-btn');
  const postActions  = document.getElementById('post-actions');
  const clearBtn     = document.getElementById('clear-btn');
  const exportBtn    = document.getElementById('export-btn');

  const agentLoop      = document.getElementById('agent-loop');
  const tasksContainer = document.getElementById('tasks-container');
  const progressFill   = document.getElementById('progress-fill');
  const summaryEl      = document.getElementById('summary');

  let reviewState = 'idle';
  let openPicker = null;

  const pickerState = {
    base: createBranchPicker({
      root: basePicker,
      select: baseSelect,
      title: 'Base branch',
      defaultLabel: 'Select base branch',
      triggerHint: 'Choose the branch to diff against.',
      searchPlaceholder: 'Search base branches',
      emptyText: 'No branches match your search.',
    }),
    target: createBranchPicker({
      root: targetPicker,
      select: targetSelect,
      title: 'Target branch',
      defaultLabel: 'Select target branch',
      triggerHint: 'Choose the branch or working tree to review.',
      searchPlaceholder: 'Search target branches',
      emptyText: 'No branches match your search.',
    }),
  };

  // ── Task registry ──
  const tasks = new Map();

  function showScreen(name) {
    screenHistory.classList.toggle('active', name === 'history');
    screenDetail.classList.toggle('active', name === 'detail');
  }

  // ═════════════════════════════════════════════
  //  History
  // ═════════════════════════════════════════════
  newReviewBtn.addEventListener('click', () => vscode.postMessage({ type: 'newReview' }));
  backBtn.addEventListener('click', () => vscode.postMessage({ type: 'backToHistory' }));

  function renderHistory(items) {
    historyList.replaceChildren();
    if (!items || items.length === 0) {
      const emptyState = el('div', { cls: 'empty-state', children: [
        el('span', { cls: 'es-icon', text: '📋' }),
        document.createElement('br'),
        'No reviews yet. Click ',
        el('b', { text: 'New Review' }),
        ' to get started.',
      ]});
      historyList.appendChild(emptyState);
      return;
    }
    for (const item of items) {
      const row = document.createElement('div');
      row.className = 'history-item';
      const target = item.targetBranch || 'HEAD + wt';
      const modelText = formatModelLabel(item.modelLabel, item.modelId);
      const dateStr = formatDate(item.timestamp);
      const hasOpen = item.openCount > 0;
      const header = el('div', { cls: 'hi-header', children: [
        el('span', { cls: 'hi-branches', children: [
          el('span', { cls: 'branch-tag', text: item.baseBranch }),
          ' ',
          el('span', { cls: 'arrow', text: '←' }),
          ' ',
          el('span', { cls: 'branch-tag', text: target }),
        ]}),
        el('span', { cls: 'hi-date', text: dateStr }),
      ]});

      const deleteBtn = el('button', { cls: 'hi-delete', text: '✕', title: 'Delete review', attrs: { 'data-id': String(item.id) } });
      const stats = el('div', { cls: 'hi-stats', children: [
        el('span', { cls: 'hi-badge ' + (hasOpen ? 'open' : 'clear'), text: hasOpen ? item.openCount + ' open' : 'clear' }),
        String(item.totalFindings) + ' finding' + (item.totalFindings !== 1 ? 's' : '') +
          ' in ' + String(item.fileCount) + ' file' + (item.fileCount !== 1 ? 's' : ''),
        deleteBtn,
      ]});

      row.appendChild(header);
      row.appendChild(stats);
      if (modelText) {
        row.appendChild(el('div', { cls: 'hi-meta', text: 'Model: ' + modelText }));
      }

      row.addEventListener('click', (e) => {
        if (deleteBtn.contains(e.target)) return;
        vscode.postMessage({ type: 'openReview', payload: item.id });
      });
      deleteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        vscode.postMessage({ type: 'deleteReview', payload: item.id });
      });
      historyList.appendChild(row);
    }
  }

  function formatDate(ts) {
    const d = new Date(ts);
    const diffMs = Date.now() - d.getTime();
    const min = Math.floor(diffMs / 60000);
    const hr  = Math.floor(diffMs / 3600000);
    const day = Math.floor(diffMs / 86400000);
    if (min < 1) return 'just now';
    if (min < 60) return min + 'm ago';
    if (hr < 24) return hr + 'h ago';
    if (day < 7) return day + 'd ago';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  function formatModelLabel(modelLabel, modelId) {
    return modelLabel || modelId || '';
  }

  /** Create an element with optional className, text content, and children. */
  function el(tag, opts) {
    const e = document.createElement(tag);
    if (opts) {
      if (opts.cls) e.className = opts.cls;
      if (opts.text != null) e.textContent = opts.text;
      if (opts.title) e.title = opts.title;
      if (opts.attrs) for (const [k, v] of Object.entries(opts.attrs)) e.setAttribute(k, v);
      if (opts.children) for (const c of opts.children) { if (typeof c === 'string') e.append(c); else e.appendChild(c); }
    }
    return e;
  }

  /** Build the review-summary DOM and replace summaryEl contents. */
  function renderSummary(totalFindings, fileCount, openCount) {
    summaryEl.textContent = '';
    summaryEl.appendChild(el('span', { cls: 'sum-headline', text: 'Review Complete' }));
    summaryEl.append(' ');
    summaryEl.appendChild(el('span', { cls: 'count', text: String(totalFindings) }));
    summaryEl.append(' finding' + (totalFindings !== 1 ? 's' : '') + ' across ');
    summaryEl.appendChild(el('span', { cls: 'count', text: String(fileCount) }));
    summaryEl.append(' file' + (fileCount !== 1 ? 's' : '') + ' — ');
    summaryEl.appendChild(el('span', { cls: 'count', text: String(openCount) }));
    summaryEl.append(' open');
    summaryEl.classList.add('visible');
  }

  // ═════════════════════════════════════════════
  //  Branch / model / controls
  // ═════════════════════════════════════════════
  baseSelect.addEventListener('change', () => {
    vscode.postMessage({ type: 'setBaseBranch', payload: baseSelect.value });
    syncPickerSelection(pickerState.base);
    updateBranchSummary();
  });
  targetSelect.addEventListener('change', () => {
    vscode.postMessage({ type: 'setTargetBranch', payload: targetSelect.value });
    syncPickerSelection(pickerState.target);
    updateBranchSummary();
  });
  modelSelect.addEventListener('change', () => {
    vscode.postMessage({ type: 'setModel', payload: modelSelect.value });
  });

  function updateBranchSummary() {
    const base = baseSelect.value;
    const target = targetSelect.value;
    if (base) {
      branchSummary.classList.remove('hidden');
      baseTag.textContent = base;
      targetTag.textContent = target || 'HEAD + working tree';
      runBtn.disabled = false;
    } else {
      branchSummary.classList.add('hidden');
      runBtn.disabled = true;
    }
  }

  runBtn.addEventListener('click', () => {
    if (reviewState === 'reviewing') return;
    vscode.postMessage({
      type: 'runReview',
      payload: {
        baseBranch: baseSelect.value,
        targetBranch: targetSelect.value,
        modelId: modelSelect.value || undefined,
      },
    });
  });
  stopBtn.addEventListener('click', () => vscode.postMessage({ type: 'stopReview' }));
  clearBtn.addEventListener('click', () => vscode.postMessage({ type: 'clearReview' }));
  exportBtn.addEventListener('click', () => vscode.postMessage({ type: 'exportMarkdown' }));

  // ═════════════════════════════════════════════
  //  Agent loop — task management
  // ═════════════════════════════════════════════
  function statusIcon(status, small) {
    if (status === 'running') {
      const s = document.createElement('span');
      s.className = small ? 'spinner-sm' : 'spinner';
      return s;
    }
    if (status === 'done') {
      const s = document.createElement('span');
      s.style.color = 'var(--vscode-testing-iconPassed,#388a34)';
      s.textContent = '✓';
      return s;
    }
    if (status === 'error') {
      const s = document.createElement('span');
      s.style.color = 'var(--vscode-errorForeground,#f44747)';
      s.textContent = '✗';
      return s;
    }
    return document.createTextNode('○');
  }

  function createTaskEl(task) {
    const group = document.createElement('div');
    group.className = 'task-group status-' + task.status;
    group.id = 'task-' + task.id;
    const header = document.createElement('div');
    header.className = 'task-header';
    const chevron = document.createElement('span');
    chevron.className = 'task-chevron';
    chevron.textContent = '▼';
    const icon = document.createElement('span');
    icon.className = 'task-icon';
    icon.appendChild(statusIcon(task.status, false));
    const label = document.createElement('span');
    label.className = 'task-label';
    label.textContent = task.label;
    header.appendChild(chevron);
    header.appendChild(icon);
    header.appendChild(label);
    if (task.detail) {
      const detail = document.createElement('span');
      detail.className = 'task-detail';
      detail.textContent = task.detail;
      header.appendChild(detail);
    }
    header.addEventListener('click', () => group.classList.toggle('collapsed'));
    const body = document.createElement('div');
    body.className = 'task-body';
    const subSteps = document.createElement('div');
    subSteps.className = 'sub-steps';
    body.appendChild(subSteps);
    group.appendChild(header);
    group.appendChild(body);
    return { el: group, header, subStepsEl: subSteps, status: task.status, subSteps: new Map() };
  }

  function handleAddTask(task) {
    if (tasks.has(task.id)) { handleUpdateTask(task); return; }
    const t = createTaskEl(task);
    tasks.set(task.id, t);
    tasksContainer.appendChild(t.el);
    scrollToBottom();
  }

  function handleUpdateTask(update) {
    const t = tasks.get(update.id);
    if (!t) return;
    if (update.status) {
      t.status = update.status;
      t.el.className = 'task-group status-' + update.status;
      const iconEl = t.header.querySelector('.task-icon');
      iconEl.textContent = '';
      iconEl.appendChild(statusIcon(update.status, false));
      if ((update.status === 'done' || update.status === 'error') && update.collapsible !== false) {
        setTimeout(() => t.el.classList.add('collapsed'), 400);
      }
    }
    if (update.label) t.header.querySelector('.task-label').textContent = update.label;
    if (update.detail !== undefined) {
      let d = t.header.querySelector('.task-detail');
      if (!d) { d = document.createElement('span'); d.className = 'task-detail'; t.header.appendChild(d); }
      d.textContent = update.detail;
    }
  }

  function renderSubStepLabel(labelEl, data) {
    labelEl.textContent = data.label;
    if (data.detail) {
      const d = document.createElement('span'); d.className = 'ss-detail';
      d.textContent = data.detail; labelEl.appendChild(d);
    }
    if (data.stream) {
      const s = document.createElement('span'); s.className = 'ss-stream';
      s.textContent = data.stream; labelEl.appendChild(s);
    }
  }

  function handleAddSubStep(step) {
    const t = tasks.get(step.taskId);
    if (!t) return;
    const el = document.createElement('div');
    el.className = 'sub-step';
    el.id = 'ss-' + step.taskId + '-' + step.id;
    const data = { label: step.label, detail: step.detail || '', status: step.status, stream: '' };
    const ssIcon = document.createElement('span');
    ssIcon.className = 'ss-icon';
    ssIcon.appendChild(statusIcon(step.status, true));
    const ssLabel = document.createElement('span');
    ssLabel.className = 'ss-label';
    el.appendChild(ssIcon);
    el.appendChild(ssLabel);
    renderSubStepLabel(ssLabel, data);
    t.subStepsEl.appendChild(el);
    t.subSteps.set(step.id, { el, data });
    scrollToBottom();
  }

  function handleUpdateSubStep(update) {
    const t = tasks.get(update.taskId);
    if (!t) return;
    const entry = t.subSteps.get(update.id);
    if (!entry) return;
    const { el, data } = entry;
    if (update.status) {
      data.status = update.status;
      const ssIconEl = el.querySelector('.ss-icon');
      ssIconEl.textContent = '';
      ssIconEl.appendChild(statusIcon(update.status, true));
    }
    if (update.label !== undefined) data.label = update.label;
    if (update.detail !== undefined) data.detail = update.detail;
    if (update.label !== undefined || update.detail !== undefined) {
      renderSubStepLabel(el.querySelector('.ss-label'), data);
    }
  }

  function handleStreamToken(data) {
    const t = tasks.get(data.taskId);
    if (!t) return;
    const entry = t.subSteps.get(data.subStepId);
    if (!entry) return;
    entry.data.stream += data.token;
    if (entry.data.stream.length > 200) entry.data.stream = '…' + entry.data.stream.slice(-180);
    let stream = entry.el.querySelector('.ss-stream');
    if (!stream) { stream = document.createElement('span'); stream.className = 'ss-stream'; entry.el.querySelector('.ss-label').appendChild(stream); }
    stream.textContent = entry.data.stream;
    scrollToBottom();
  }

  function updateProgressBar() {
    const all = Array.from(tasks.values());
    if (all.length === 0) { progressFill.style.width = '0%'; return; }
    const done = all.filter(t => t.status === 'done' || t.status === 'error').length;
    const running = all.filter(t => t.status === 'running').length;
    const pct = Math.round(((done + running * 0.3) / all.length) * 100);
    progressFill.style.width = Math.min(pct, 100) + '%';
  }

  function scrollToBottom() {
    requestAnimationFrame(() => { tasksContainer.scrollTop = tasksContainer.scrollHeight; });
  }

  // ═════════════════════════════════════════════
  //  Message handler
  // ═════════════════════════════════════════════
  let legacyIdSeq = 0;
  window.addEventListener('message', (event) => {
    const msg = event.data;
    switch (msg.type) {

      case 'setHistory': renderHistory(msg.payload); break;
      case 'showHistoryList': showScreen('history'); resetDetailState(); break;

      case 'showReviewDetail': {
        showScreen('detail');
        const data = msg.payload;
        if (data.isPastReview) {
          pastReviewHeader.classList.remove('hidden');
          newReviewControls.classList.add('hidden');
          dhBase.textContent = data.baseBranch;
          dhTarget.textContent = data.targetBranch || 'HEAD + wt';
          dhDate.textContent = new Date(data.timestamp).toLocaleString();
          const modelText = formatModelLabel(data.modelLabel, data.modelId);
          if (modelText) {
            dhModel.textContent = 'Model: ' + modelText;
            dhModel.classList.remove('hidden');
          } else {
            dhModel.textContent = '';
            dhModel.classList.add('hidden');
          }
          tasksContainer.innerHTML = '';
          tasks.clear();
          agentLoop.classList.add('visible');
          if (data.agentSteps && data.agentSteps.length > 0) {
            let hIdx = 0;
            for (const step of data.agentSteps) {
              const id = 'h-' + step.label.replace(/[^a-zA-Z0-9]/g, '_') + '-' + (hIdx++);
              handleAddTask({ id, label: step.label, status: step.status === 'pending' ? 'done' : step.status, detail: step.detail, collapsible: true });
              const t = tasks.get(id);
              if (t) t.el.classList.add('collapsed');
            }
          }
          progressFill.style.width = '100%';
          if (data.summary) {
            renderSummary(data.summary.totalFindings, data.summary.fileCount, data.summary.openCount);
          }
          postActions.classList.remove('hidden');
          reviewState = 'done';
        } else {
          pastReviewHeader.classList.add('hidden');
          newReviewControls.classList.remove('hidden');
          dhModel.textContent = '';
          dhModel.classList.add('hidden');
          resetDetailState();
        }
        break;
      }

      case 'setBranches': {
        const { locals, remotes, currentBranch } = msg.payload;
        populateSelect(baseSelect, locals, remotes, currentBranch, '');
        populateTargetSelect(targetSelect, locals, currentBranch);
        syncPickerOptions(pickerState.base);
        syncPickerOptions(pickerState.target);
        updateBranchSummary();
        break;
      }
      case 'setSelectedBranches': {
        baseSelect.value = msg.payload.baseBranch;
        targetSelect.value = msg.payload.targetBranch;
        syncPickerSelection(pickerState.base);
        syncPickerSelection(pickerState.target);
        updateBranchSummary();
        break;
      }
      case 'setModels': {
        const { models, selectedId } = msg.payload;
        modelSelect.innerHTML = '';
        for (const m of models) {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.label;
          modelSelect.appendChild(opt);
        }
        if (selectedId) modelSelect.value = selectedId;
        break;
      }

      case 'setInstructionsStatus': {
        const { exists, path } = msg.payload;
        instrRow.classList.remove('hidden');
        if (exists) {
          instrDot.className = 'dot active';
          instrText.textContent = '.copilot-review-agent-instructions.md';
          instrAction.textContent = 'Open';
          instrAction.onclick = () => vscode.postMessage({ type: 'openInstructions' });
        } else {
          instrDot.className = 'dot inactive';
          instrText.textContent = 'No custom instructions';
          instrAction.textContent = 'Create';
          instrAction.onclick = () => vscode.postMessage({ type: 'createInstructions' });
        }
        break;
      }

      case 'setReviewState': {
        reviewState = msg.payload.state;
        if (reviewState === 'reviewing') {
          runBtn.disabled = true;
          runIcon.textContent = '⏳';
          runLabel.textContent = 'Reviewing…';
          baseSelect.disabled = true;
          targetSelect.disabled = true;
          syncPickerDisabled(pickerState.base, true);
          syncPickerDisabled(pickerState.target, true);
          modelSelect.disabled = true;
          stopBtn.classList.remove('hidden');
          tasksContainer.innerHTML = '';
          tasks.clear();
          agentLoop.classList.add('visible');
          summaryEl.classList.remove('visible');
          postActions.classList.add('hidden');
          progressFill.style.width = '0%';
        } else if (reviewState === 'done') {
          runBtn.disabled = false;
          runIcon.textContent = '🔄';
          runLabel.textContent = 'Re-run Review';
          baseSelect.disabled = false;
          targetSelect.disabled = false;
          syncPickerDisabled(pickerState.base, false);
          syncPickerDisabled(pickerState.target, false);
          modelSelect.disabled = false;
          stopBtn.classList.add('hidden');
          postActions.classList.remove('hidden');
          progressFill.style.width = '100%';
        } else if (reviewState === 'error') {
          runBtn.disabled = false;
          runIcon.textContent = '▶';
          runLabel.textContent = 'Run Review';
          baseSelect.disabled = false;
          targetSelect.disabled = false;
          syncPickerDisabled(pickerState.base, false);
          syncPickerDisabled(pickerState.target, false);
          modelSelect.disabled = false;
          stopBtn.classList.add('hidden');
        } else {
          runBtn.disabled = false;
          runIcon.textContent = '▶';
          runLabel.textContent = 'Run Review';
          baseSelect.disabled = false;
          targetSelect.disabled = false;
          syncPickerDisabled(pickerState.base, false);
          syncPickerDisabled(pickerState.target, false);
          modelSelect.disabled = false;
          stopBtn.classList.add('hidden');
          agentLoop.classList.remove('visible');
          summaryEl.classList.remove('visible');
          postActions.classList.add('hidden');
          progressFill.style.width = '0%';
        }
        break;
      }

      case 'addTask': handleAddTask(msg.payload); updateProgressBar(); break;
      case 'updateTask': handleUpdateTask(msg.payload); updateProgressBar(); break;
      case 'addSubStep': handleAddSubStep(msg.payload); break;
      case 'updateSubStep': handleUpdateSubStep(msg.payload); break;
      case 'streamToken': handleStreamToken(msg.payload); break;

      case 'addAgentStep': {
        const s = msg.payload;
        const id = 'legacy-' + s.label.replace(/[^a-zA-Z0-9]/g, '_') + '-' + (legacyIdSeq++);
        handleAddTask({ id, label: s.label, status: s.status === 'pending' ? 'running' : s.status, detail: s.detail });
        updateProgressBar();
        break;
      }

      case 'setReviewSummary': {
        const { openCount, fileCount, totalFindings } = msg.payload;
        renderSummary(totalFindings, fileCount, openCount);
        break;
      }

      case 'resetReview': resetDetailState(); break;
    }
  });

  function resetDetailState() {
    reviewState = 'idle';
    agentLoop.classList.remove('visible');
    summaryEl.classList.remove('visible');
    tasksContainer.innerHTML = '';
    tasks.clear();
    postActions.classList.add('hidden');
    runBtn.disabled = false;
    runIcon.textContent = '▶';
    runLabel.textContent = 'Run Review';
    baseSelect.disabled = false;
    targetSelect.disabled = false;
    syncPickerDisabled(pickerState.base, false);
    syncPickerDisabled(pickerState.target, false);
    modelSelect.disabled = false;
    progressFill.style.width = '0%';
  }

  // ═════════════════════════════════════════════
  //  Helpers
  // ═════════════════════════════════════════════
  function createBranchPicker(config) {
    const trigger = el('button', {
      cls: 'picker-trigger',
      attrs: {
        type: 'button',
        'aria-haspopup': 'listbox',
        'aria-expanded': 'false',
        'aria-label': config.title,
      },
    });
    const triggerText = el('span', { cls: 'picker-trigger-text' });
    const triggerLabel = el('span', { cls: 'picker-trigger-label', text: config.defaultLabel });
    const triggerDescription = el('span', { cls: 'picker-trigger-description', text: config.triggerHint });
    triggerText.appendChild(triggerLabel);
    triggerText.appendChild(triggerDescription);
    trigger.appendChild(triggerText);
    trigger.appendChild(el('span', { cls: 'picker-trigger-icon', text: '▾' }));

    const panel = el('div', { cls: 'picker-panel hidden' });
    const searchInput = el('input', {
      cls: 'picker-search',
      attrs: {
        type: 'text',
        placeholder: config.searchPlaceholder,
        autocomplete: 'off',
        spellcheck: 'false',
      },
    });
    const optionsEl = el('div', { cls: 'picker-options', attrs: { role: 'listbox' } });
    const emptyEl = el('div', { cls: 'picker-empty hidden', text: config.emptyText });
    panel.appendChild(searchInput);
    panel.appendChild(optionsEl);
    panel.appendChild(emptyEl);

    config.root.replaceChildren(trigger, panel);

    const state = {
      ...config,
      trigger,
      triggerLabel,
      triggerDescription,
      panel,
      searchInput,
      optionsEl,
      emptyEl,
      entries: [],
      filteredEntries: [],
      activeIndex: -1,
    };

    trigger.addEventListener('click', () => {
      if (state.select.disabled) return;
      if (openPicker === state) {
        closePicker(state);
      } else {
        openPickerPanel(state);
      }
    });

    trigger.addEventListener('keydown', (event) => {
      if (state.select.disabled) return;
      if (event.key === 'ArrowDown' || event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        openPickerPanel(state);
      }
    });

    searchInput.addEventListener('input', () => renderPickerOptions(state, searchInput.value));
    searchInput.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        moveActiveOption(state, 1);
      } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        moveActiveOption(state, -1);
      } else if (event.key === 'Enter') {
        event.preventDefault();
        const entry = state.filteredEntries[state.activeIndex];
        if (entry) {
          selectPickerValue(state, entry.value);
        }
      } else if (event.key === 'Escape') {
        event.preventDefault();
        closePicker(state);
        state.trigger.focus();
      }
    });

    return state;
  }

  function syncPickerOptions(state) {
    state.entries = extractSelectEntries(state.select);
    renderPickerOptions(state, state.searchInput.value);
    syncPickerSelection(state);
  }

  function syncPickerSelection(state) {
    const selectedEntry = state.entries.find(entry => entry.value === state.select.value);
    if (!selectedEntry) {
      state.triggerLabel.textContent = state.defaultLabel;
      state.triggerDescription.textContent = state.triggerHint;
    } else {
      state.triggerLabel.textContent = selectedEntry.label;
      state.triggerDescription.textContent = selectedEntry.description || selectedEntry.group || state.triggerHint;
    }
    renderPickerOptions(state, state.searchInput.value);
  }

  function syncPickerDisabled(state, disabled) {
    state.trigger.disabled = disabled;
    if (disabled) {
      closePicker(state);
    }
  }

  function openPickerPanel(state) {
    if (openPicker && openPicker !== state) {
      closePicker(openPicker);
    }
    openPicker = state;
    state.root.classList.add('open');
    state.panel.classList.remove('hidden');
    state.trigger.setAttribute('aria-expanded', 'true');
    state.searchInput.value = '';
    renderPickerOptions(state, '');
    state.searchInput.focus();
    state.searchInput.select();
  }

  function closePicker(state) {
    if (!state) return;
    state.root.classList.remove('open');
    state.panel.classList.add('hidden');
    state.trigger.setAttribute('aria-expanded', 'false');
    state.activeIndex = -1;
    if (openPicker === state) {
      openPicker = null;
    }
  }

  function renderPickerOptions(state, query) {
    const normalizedQuery = query.trim().toLowerCase();
    const filtered = state.entries.filter(entry => {
      if (!normalizedQuery) return true;
      return [entry.label, entry.description, entry.group, entry.value]
        .filter(Boolean)
        .some(text => text.toLowerCase().includes(normalizedQuery));
    });

    state.filteredEntries = filtered;
    state.optionsEl.replaceChildren();
    state.emptyEl.classList.toggle('hidden', filtered.length > 0);

    let currentGroup = null;
    filtered.forEach((entry, index) => {
      if (entry.group !== currentGroup) {
        currentGroup = entry.group;
        if (currentGroup) {
          state.optionsEl.appendChild(el('div', { cls: 'picker-group-label', text: currentGroup }));
        }
      }

      const option = el('button', {
        cls: 'picker-option',
        attrs: { type: 'button', role: 'option', 'data-value': entry.value },
      });
      if (entry.value === state.select.value) {
        option.classList.add('selected');
      }

      const main = el('span', { cls: 'picker-option-main' });
      main.appendChild(el('span', { cls: 'picker-option-label', text: entry.label }));
      if (entry.description) {
        main.appendChild(el('span', { cls: 'picker-option-description', text: entry.description }));
      }

      option.appendChild(main);
      option.appendChild(el('span', { cls: 'picker-option-check', text: '✓' }));
      option.addEventListener('click', () => selectPickerValue(state, entry.value));
      option.addEventListener('mousemove', () => setActiveOption(state, index));
      state.optionsEl.appendChild(option);
    });

    if (filtered.length === 0) {
      state.activeIndex = -1;
      return;
    }

    const selectedIndex = filtered.findIndex(entry => entry.value === state.select.value);
    const nextIndex = selectedIndex >= 0 ? selectedIndex : 0;
    setActiveOption(state, nextIndex);
  }

  function moveActiveOption(state, delta) {
    if (state.filteredEntries.length === 0) return;
    const nextIndex = state.activeIndex < 0
      ? 0
      : (state.activeIndex + delta + state.filteredEntries.length) % state.filteredEntries.length;
    setActiveOption(state, nextIndex);
  }

  function setActiveOption(state, index) {
    state.activeIndex = index;
    const options = Array.from(state.optionsEl.querySelectorAll('.picker-option'));
    options.forEach((option, optionIndex) => {
      option.classList.toggle('active', optionIndex === index);
      if (optionIndex === index) {
        option.scrollIntoView({ block: 'nearest' });
      }
    });
  }

  function selectPickerValue(state, value) {
    state.select.value = value;
    state.select.dispatchEvent(new Event('change', { bubbles: true }));
    closePicker(state);
    state.trigger.focus();
  }

  function extractSelectEntries(select) {
    const entries = [];
    for (const child of Array.from(select.children)) {
      if (child.tagName === 'OPTGROUP') {
        const group = child.label;
        for (const option of Array.from(child.children)) {
          entries.push({
            value: option.value,
            label: option.textContent || option.value,
            description: option.dataset.description || '',
            group,
          });
        }
      } else if (child.tagName === 'OPTION') {
        entries.push({
          value: child.value,
          label: child.textContent || child.value,
          description: child.dataset.description || '',
          group: '',
        });
      }
    }
    return entries;
  }

  document.addEventListener('click', (event) => {
    if (!openPicker) return;
    if (openPicker.root.contains(event.target)) return;
    closePicker(openPicker);
  });

  function populateSelect(select, locals, remotes, currentBranch, selectedValue) {
    select.innerHTML = '';
    const localGroup = document.createElement('optgroup');
    localGroup.label = 'Local Branches';
    for (const b of locals) {
      const opt = document.createElement('option');
      opt.value = b;
      opt.textContent = b + (b === currentBranch ? ' (current)' : '');
      opt.dataset.description = b === currentBranch ? 'Current branch' : 'Local branch';
      localGroup.appendChild(opt);
    }
    select.appendChild(localGroup);
    const uniqueRemotes = remotes.filter(r => {
      const stripped = r.replace(/^origin\//, '');
      return !locals.includes(stripped) && stripped !== 'HEAD';
    });
    if (uniqueRemotes.length > 0) {
      const remoteGroup = document.createElement('optgroup');
      remoteGroup.label = 'Remote Branches';
      for (const b of uniqueRemotes) {
        const opt = document.createElement('option');
        opt.value = b;
        opt.textContent = b;
        opt.dataset.description = 'Remote branch';
        remoteGroup.appendChild(opt);
      }
      select.appendChild(remoteGroup);
    }
    if (selectedValue) select.value = selectedValue;
  }

  function populateTargetSelect(select, locals, currentBranch) {
    select.innerHTML = '';
    const wt = document.createElement('option');
    wt.value = '';
    wt.textContent = currentBranch + ' + working tree';
    wt.dataset.description = 'Current branch plus uncommitted changes';
    select.appendChild(wt);
    const co = document.createElement('option');
    co.value = currentBranch;
    co.textContent = currentBranch + ' (committed only)';
    co.dataset.description = 'Current branch committed changes only';
    select.appendChild(co);
    const grp = document.createElement('optgroup');
    grp.label = 'Other Branches';
    for (const b of locals) {
      if (b === currentBranch) continue;
      const opt = document.createElement('option');
      opt.value = b; opt.textContent = b;
      opt.dataset.description = 'Local branch';
      grp.appendChild(opt);
    }
    if (grp.children.length > 0) select.appendChild(grp);
  }

  // Signal readiness to the extension host, then request history
  vscode.postMessage({ type: 'ready' });
  vscode.postMessage({ type: 'loadHistory' });
})();
</script>
